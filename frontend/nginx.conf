server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
